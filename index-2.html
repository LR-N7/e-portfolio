<style>
:root{--paper:#F3F5F8;--ink:#14182B;--muted:#586079;--line:#D3D9E6;--grid:rgba(70,90,150,.10);--violet:#5B2E91;
--serif:"Source Serif 4",Georgia,serif;--sans:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif}
@media(prefers-color-scheme:dark){:root{--paper:#0F1220;--ink:#E9EBF3;--muted:#A0A7BD;--line:#272D47;--grid:rgba(140,160,230,.09);--violet:#B99CEB}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font:400 1.0625rem/1.7 var(--serif)}
.wrap{width:100%;max-width:1080px;margin:0 auto;padding:0 clamp(1rem,4vw,2rem)}
header{border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:1rem;height:56px}
.brand{font:800 1.1rem var(--sans)}
.state{display:flex;align-items:center;gap:.4rem;font:500 .95rem var(--sans);color:var(--muted)}
main{flex:1}
.hero{padding-top:clamp(1.75rem,5vw,3.5rem);padding-bottom:2.5rem}
h1{margin:0;font:800 clamp(2.5rem,7.5vw,4.75rem)/1 var(--sans);letter-spacing:-.035em}
.lead{margin:.9rem 0 1.5rem;max-width:44ch;font:500 clamp(1.05rem,2.2vw,1.3rem)/1.4 var(--sans)}
.fig{border:1px solid var(--line);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:25px 25px}
.fig svg{display:block;width:100%;height:clamp(80px,14vh,140px)}
.ax{stroke:var(--line);stroke-width:1.5;vector-effect:non-scaling-stroke}
.ideal{fill:none;stroke:var(--muted);stroke-width:1;stroke-dasharray:4 4;vector-effect:non-scaling-stroke}
.wave{fill:none;stroke:var(--violet);stroke-width:2.5;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.fig form{display:grid;grid-template-columns:1fr auto;gap:.6rem 1rem;padding:1.25rem;background:var(--paper);border-top:1px solid var(--line)}
.fig form>label:first-child,.show,#msg{grid-column:1/-1}
label{font:700 .95rem var(--sans)}
#pw{width:100%;padding:.75rem 1rem;font:inherit;font-size:1.05rem;border:2px solid var(--muted);border-radius:4px;background:var(--paper);color:var(--ink)}
button{padding:.75rem 1.5rem;font:700 .95rem var(--sans);border:2px solid var(--violet);border-radius:4px;background:var(--violet);color:var(--paper);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.show{display:flex;align-items:center;gap:.5rem;font:500 .9rem var(--sans);color:var(--muted);cursor:pointer}
.show input{width:1.05rem;height:1.05rem;accent-color:var(--violet)}
#msg{min-height:1.6em;margin:0;font:500 .95rem var(--sans)}
#msg.err{padding-left:.7rem;border-left:3px solid var(--violet)}
noscript{display:block;margin-top:1rem;font:500 .95rem var(--sans)}
#pw:focus-visible,button:focus-visible,.show input:focus-visible{outline:3px solid var(--violet);outline-offset:3px}
footer{padding:1.5rem 0 2rem;border-top:1px solid var(--line);font:400 .9rem var(--sans);color:var(--muted)}
@media(max-width:560px){.fig form{grid-template-columns:1fr}}
</style>
</head>
