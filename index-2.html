<title>E-portfolio — accès protégé</title>

<style>
:root{--paper:#F3F5F8;--ink:#14182B;--muted:#586079;--line:#D3D9E6;--violet:#5B2E91;--sans:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif}
@media(prefers-color-scheme:dark){:root{--paper:#0F1220;--ink:#E9EBF3;--muted:#A0A7BD;--line:#272D47;--violet:#B99CEB}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1.5rem;background:var(--paper);color:var(--ink);font:400 1.0625rem/1.6 "Source Serif 4",Georgia,serif}
main{width:min(420px,100%)}
h1{margin:0 0 1rem;font:800 clamp(2.4rem,9vw,3.4rem)/1 var(--sans);letter-spacing:-.03em}
p{margin:0 0 1.5rem;color:var(--muted)}
label{display:block;margin-bottom:.4rem;font:700 .95rem var(--sans)}
input{width:100%;padding:.7rem .8rem;font:inherit;border:2px solid var(--line);border-radius:4px;background:var(--paper);color:var(--ink)}
button{margin-top:1rem;padding:.7rem 1.4rem;font:700 .95rem var(--sans);border:2px solid var(--violet);border-radius:4px;background:var(--violet);color:var(--paper);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
input:focus-visible,button:focus-visible{outline:3px solid var(--violet);outline-offset:3px}
#msg{min-height:1.6em;margin:1rem 0 0;font:500 .95rem var(--sans);color:var(--ink)}
</style>
</head>
<body>
<main>
  <h1>E-portfolio</h1>
  <p>Accès protégé. Saisis le mot de passe qui t’a été communiqué.</p>
  <form id="f">
    <label for="pw">Mot de passe</label>
    <input id="pw" type="password" autocomplete="current-password" required autofocus>
    <button id="go" type="submit">Ouvrir</button>
    <p id="msg" role="alert"></p>
  </form>
  <noscript>JavaScript est nécessaire pour déverrouiller cette page.</noscript>
</main>
