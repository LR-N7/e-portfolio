<title>E-portfolio — accès protégé</title>

<style>
:root{--paper:#F3F5F8;--panel:#FFFFFF;--ink:#14182B;--muted:#586079;--line:#D3D9E6;--violet:#5B2E91;--sans:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif}
@media(prefers-color-scheme:dark){:root{--paper:#0F1220;--panel:#181D33;--ink:#E9EBF3;--muted:#A0A7BD;--line:#272D47;--violet:#B99CEB}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1.5rem;background:var(--paper);color:var(--ink);font:400 1.0625rem/1.6 "Source Serif 4",Georgia,serif}
main{width:min(440px,100%);padding:clamp(1.5rem,5vw,2.25rem);background:var(--panel);border:2px solid var(--ink);border-radius:8px}
svg{display:block;margin-bottom:1rem;color:var(--violet)}
h1{margin:0 0 .75rem;font:800 clamp(2.2rem,8vw,3rem)/1 var(--sans);letter-spacing:-.03em}
p{margin:0 0 1.5rem;color:var(--muted)}
label{display:block;margin-bottom:.4rem;font:700 1rem var(--sans)}
#pw{display:block;width:100%;padding:.85rem 1rem;font:inherit;font-size:1.1rem;border:2px solid var(--muted);border-radius:6px;background:var(--paper);color:var(--ink)}
.show{display:flex;align-items:center;gap:.5rem;margin:.75rem 0 0;font:500 .95rem var(--sans);cursor:pointer}
.show input{width:1.1rem;height:1.1rem;accent-color:var(--violet)}
button{display:block;width:100%;margin-top:1.25rem;padding:.9rem 1.4rem;font:700 1.05rem var(--sans);border:2px solid var(--violet);border-radius:6px;background:var(--violet);color:var(--paper);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#pw:focus-visible,button:focus-visible,.show input:focus-visible{outline:3px solid var(--violet);outline-offset:3px}
#msg{min-height:1.6em;margin:1rem 0 0;font:500 .95rem var(--sans);color:var(--ink)}
</style>
</head>
<body>
<main>
  <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
  <h1>E-portfolio</h1>
  <p>Cet accès est protégé. Saisis le mot de passe qui t’a été communiqué pour consulter le portfolio.</p>
  <form id="f">
    <label for="pw">Mot de passe</label>
    <input id="pw" type="password" placeholder="Saisis le mot de passe" autocomplete="current-password" required autofocus>
    <label class="show"><input type="checkbox" id="show"> Afficher le mot de passe</label>
    <button id="go" type="submit">Ouvrir le portfolio</button>
    <p id="msg" role="alert"></p>
  </form>
  <noscript>JavaScript est nécessaire pour déverrouiller cette page.</noscript>
</main>
